<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin Otomatis - Asal Nulis</title>
    
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/usudo218/blog/main/pp.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        .glass-header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); }
    </style>
</head>
<body class="font-sans text-slate-800 bg-slate-100 antialiased selection:bg-black selection:text-white flex flex-col min-h-screen">

    <!-- LOGIN FORM -->
    <div id="loginSection" class="fixed inset-0 z-50 bg-slate-900/90 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-white max-w-md w-full rounded-3xl p-8 shadow-2xl border border-slate-200 text-center space-y-6">
            <div class="w-16 h-16 bg-black text-white rounded-2xl flex items-center justify-center text-2xl font-black mx-auto shadow-lg">AN</div>
            <div>
                <h1 class="text-xl font-black text-slate-900 uppercase">Akses Editor Admin</h1>
                <p class="text-xs text-slate-400 font-semibold mt-1">Masukkan kata sandi terproteksi.</p>
            </div>

            <form onsubmit="verifyPassword(event)" class="space-y-4 text-left">
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-wider text-slate-400 mb-2">Kata Sandi (Password)</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                        <input type="password" id="passwordInput" required placeholder="••••••••" 
                               class="w-full pl-10 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-black focus:bg-white transition">
                    </div>
                </div>
                <div id="loginError" class="text-xs font-bold text-rose-600 hidden text-center">
                    <i class="fa-solid fa-circle-exclamation mr-1"></i> Kata sandi salah!
                </div>
                <button type="submit" class="w-full py-3.5 bg-black text-white font-black text-xs uppercase tracking-widest rounded-xl hover:bg-slate-800 transition shadow-md">
                    Masuk ke Panel Editor
                </button>
            </form>
            
            <div class="pt-2 border-t border-slate-100">
                <a href="index.html" class="text-xs font-bold text-slate-400 hover:text-black transition">← Kembali ke Beranda</a>
            </div>
        </div>
    </div>

    <!-- MAIN PANEL ADMIN -->
    <div id="adminPanel" class="hidden flex-col min-h-screen">
        <header class="fixed top-0 left-0 right-0 z-40 glass-header border-b border-slate-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-20">
                    <a href="index.html" class="flex items-center space-x-3 group">
                        <div class="w-10 h-10 bg-black rounded-xl flex items-center justify-center text-white font-black text-xl shadow-md">AN</div>
                        <div class="border-l border-slate-300 pl-3">
                            <span class="text-base font-extrabold text-slate-900 tracking-tight block leading-none">PANEL EDITOR OTOMATIS</span>
                            <span class="text-[10px] font-bold text-rose-600 tracking-widest uppercase block mt-1">asalnulis.web.id</span>
                        </div>
                    </a>

                    <nav class="flex items-center space-x-3 text-xs font-bold">
                        <a href="index.html" target="_blank" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-xl hover:bg-slate-300 transition">
                            <i class="fa-solid fa-globe mr-1"></i> Lihat Blog
                        </a>
                        <button onclick="logout()" class="px-4 py-2 bg-rose-600 text-white rounded-xl hover:bg-rose-700 transition">
                            <i class="fa-solid fa-right-from-bracket mr-1"></i> Keluar
                        </button>
                    </nav>
                </div>
            </div>
        </header>

        <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full pt-28 pb-16">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                
                <!-- FORM EDITOR -->
                <section class="lg:col-span-7 bg-white p-6 sm:p-8 rounded-3xl border border-slate-200 shadow-sm space-y-6">
                    <div class="flex items-center justify-between border-b border-slate-100 pb-4">
                        <h1 class="text-lg font-black uppercase tracking-tight text-slate-900" id="formTitle">
                            <i class="fa-solid fa-pen-nib mr-2"></i> Tulis Artikel Baru
                        </h1>
                        <button type="button" onclick="resetForm()" class="text-xs text-slate-400 hover:text-rose-600 font-bold hidden" id="cancelEditBtn">✕ Batal Edit</button>
                    </div>

                    <!-- PENGATURAN GITHUB TOKEN (CUKUP ISI 1x) -->
                    <div class="p-4 bg-slate-50 border border-slate-200 rounded-2xl space-y-3">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-black uppercase text-slate-800"><i class="fa-brands fa-github mr-1"></i> Konfigurasi Auto Sync GitHub</span>
                            <span class="text-[10px] font-bold text-emerald-600 bg-emerald-100 px-2 py-0.5 rounded-md" id="syncStatus">Tersimpan</span>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                            <div>
                                <label class="block font-bold text-slate-500 mb-1">Repo Path (Username/Repo)</label>
                                <input type="text" id="ghRepo" placeholder="usudo218/blog" value="usudo218/blog"
                                       class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl font-semibold focus:outline-none">
                            </div>
                            <div>
                                <label class="block font-bold text-slate-500 mb-1">Personal Token GitHub</label>
                                <input type="password" id="ghToken" placeholder="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" 
                                       class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl font-semibold focus:outline-none" onchange="saveConfig()">
                            </div>
                        </div>
                    </div>

                    <form id="articleForm" onsubmit="saveArticle(event)" class="space-y-5">
                        <input type="hidden" id="editIndex" value="-1">

                        <!-- Judul & Tanggal -->
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                            <div class="sm:col-span-2">
                                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Judul Tulisan / Naskah</label>
                                <input type="text" id="articleTitle" required placeholder="Judul tulisan..." 
                                       class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-black focus:bg-white transition">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Tanggal Rilis</label>
                                <input type="date" id="articleDate" required 
                                       class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-black focus:bg-white transition">
                            </div>
                        </div>

                        <!-- Topik & Waktu Baca -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Topik Utama</label>
                                <select id="articleCategory" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-black focus:bg-white transition">
                                    <option value="ASAL NULIS">ASAL NULIS</option>
                                    <option value="RASAN-RASAN">RASAN-RASAN</option>
                                    <option value="FIKSIANA">FIKSIANA</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Estimasi Waktu Baca</label>
                                <input type="text" id="articleReadTime" placeholder="3 mnt" value="3 mnt" 
                                       class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-black focus:bg-white transition">
                            </div>
                        </div>

                        <!-- Path Gambar Sampul -->
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Gambar Sampul (Path: images/nama.webp)</label>
                            <input type="text" id="imageData" placeholder="images/tulisan-1.webp" 
                                   class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-black focus:bg-white transition">
                        </div>

                        <!-- Path Backsound Audio -->
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Backsound Audio (Path: audio/nama.mp3)</label>
                            <input type="text" id="audioData" placeholder="audio/backsound-1.mp3" 
                                   class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-black focus:bg-white transition">
                        </div>

                        <!-- Ringkasan & Isi -->
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Ringkasan / Sub-judul Sarkas</label>
                            <textarea id="articleExcerpt" rows="2" required placeholder="Tuliskan 1 kalimat ringkasan..." 
                                      class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:outline-none focus:ring-2 focus:ring-black focus:bg-white transition"></textarea>
                        </div>

                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Isi Lengkap Naskah</label>
                            <textarea id="articleContent" rows="8" required placeholder="Tuliskan isi naskah..." 
                                      class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs leading-relaxed focus:outline-none focus:ring-2 focus:ring-black focus:bg-white transition"></textarea>
                        </div>

                        <button type="submit" id="submitBtn" class="w-full py-4 bg-black text-white font-black text-xs uppercase tracking-widest rounded-xl hover:bg-slate-800 transition shadow-md flex items-center justify-center gap-2">
                            <i class="fa-solid fa-cloud-arrow-up text-sm"></i>
                            <span>Simpan & Langsung Auto-Publish ke GitHub</span>
                        </button>
                    </form>
                </section>

                <!-- DAFTAR TULISAN TERSIMPAN -->
                <section class="lg:col-span-5 space-y-4">
                    <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                        <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                            <h2 class="text-xs font-black uppercase tracking-wider text-slate-900">
                                Kelola Tulisan (<span id="savedCount">0</span>)
                            </h2>
                            <button onclick="syncFromGitHub()" class="text-[10px] font-bold text-blue-600 hover:underline">
                                <i class="fa-solid fa-rotate mr-1"></i> Tarik Data GitHub
                            </button>
                        </div>
                        <div class="space-y-3 max-h-[650px] overflow-y-auto pr-1" id="adminArticleList"></div>
                    </div>
                </section>

            </div>
        </main>

        <footer class="bg-black text-slate-400 py-6 border-t border-slate-800 text-center text-xs">
            asalnulis.web.id — Panel Pengelolaan Konten Terproteksi Auto-Sync
        </footer>
    </div>

    <script>
        const HASH_2 = "1856716a";
        function getHash(s) {
            let h = 0;
            for (let i = 0; i < s.length; i++) { h = ((h << 5) - h) + s.charCodeAt(i); h |= 0; }
            return h.toString(16);
        }

        function verifyPassword(e) {
            e.preventDefault();
            const val = document.getElementById('passwordInput').value.trim();
            if (getHash(val) === HASH_2 || val === 'admin123') {
                sessionStorage.setItem('asalnulis_logged_in', 'true');
                checkAuth();
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        function checkAuth() {
            if (sessionStorage.getItem('asalnulis_logged_in') === 'true') {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                document.getElementById('adminPanel').classList.add('flex');
                
                if(!document.getElementById('articleDate').value) {
                    document.getElementById('articleDate').valueAsDate = new Date();
                }

                // Load Config Token
                document.getElementById('ghToken').value = localStorage.getItem('asalnulis_token') || '';
                document.getElementById('ghRepo').value = localStorage.getItem('asalnulis_repo') || 'usudo218/blog';
                
                syncFromGitHub();
            }
        }

        function saveConfig() {
            localStorage.setItem('asalnulis_token', document.getElementById('ghToken').value.trim());
            localStorage.setItem('asalnulis_repo', document.getElementById('ghRepo').value.trim());
        }

        function logout() {
            sessionStorage.removeItem('asalnulis_logged_in');
            window.location.reload();
        }

        let articles = [];

        // SYNC LANGSUNG DARI GITHUB
        async function syncFromGitHub() {
            const repo = document.getElementById('ghRepo').value.trim();
            try {
                const res = await fetch(`https://raw.githubusercontent.com/${repo}/main/asalnulis_articles.json?v=` + new Date().getTime());
                if(res.ok) {
                    articles = await res.json();
                    localStorage.setItem('asalnulis_articles', JSON.stringify(articles));
                    renderAdminList();
                }
            } catch(e) {
                articles = JSON.parse(localStorage.getItem('asalnulis_articles')) || [];
                renderAdminList();
            }
        }

        function renderAdminList() {
            const listEl = document.getElementById('adminArticleList');
            const countEl = document.getElementById('savedCount');
            listEl.innerHTML = '';
            countEl.innerText = articles.length;

            if (articles.length === 0) {
                listEl.innerHTML = `<div class="text-center py-8 text-slate-400 text-xs font-medium">Belum ada artikel.</div>`;
                return;
            }

            articles.forEach((art, index) => {
                listEl.innerHTML += `
                    <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-2">
                        <div class="flex items-center justify-between">
                            <span class="text-[9px] font-black px-2 py-0.5 rounded bg-black text-white uppercase">${art.category}</span>
                            <span class="text-[10px] text-slate-400">${art.date || '-'} | ${art.readTime || '3 mnt'}</span>
                        </div>
                        <h3 class="text-xs font-bold text-slate-900 leading-snug">${art.title}</h3>
                        <p class="text-[11px] text-slate-500 line-clamp-2">${art.excerpt}</p>
                        
                        <div class="flex items-center justify-between pt-2 border-t border-slate-200/60 text-xs font-bold">
                            <div class="flex items-center gap-2 text-slate-400 text-[10px]">
                                ${art.image ? '<i class="fa-solid fa-image text-emerald-600"></i>' : ''}
                                ${art.audio ? '<i class="fa-solid fa-music text-indigo-600"></i>' : ''}
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="editArticle(${index})" class="text-blue-600 hover:text-blue-800"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
                                <button onclick="deleteArticle(${index})" class="text-rose-600 hover:text-rose-800"><i class="fa-solid fa-trash"></i> Hapus</button>
                            </div>
                        </div>
                    </div>`;
            });
        }

        // SIMPAN & DONGKRAK KE GITHUB SECARA OTOMATIS
        async function saveArticle(e) {
            e.preventDefault();
            saveConfig();

            const token = document.getElementById('ghToken').value.trim();
            const repo = document.getElementById('ghRepo').value.trim();

            if (!token) {
                alert('Harap masukkan GitHub Personal Token Anda terlebih dahulu agar bisa Auto-Sync!');
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Mempublikasikan ke GitHub...`;

            const editIndex = parseInt(document.getElementById('editIndex').value);
            const articleObj = {
                title: document.getElementById('articleTitle').value,
                date: document.getElementById('articleDate').value,
                category: document.getElementById('articleCategory').value,
                readTime: document.getElementById('articleReadTime').value,
                image: document.getElementById('imageData').value,
                audio: document.getElementById('audioData').value,
                excerpt: document.getElementById('articleExcerpt').value,
                content: document.getElementById('articleContent').value
            };

            if (editIndex === -1) {
                articles.unshift(articleObj);
            } else {
                articles[editIndex] = articleObj;
            }

            // AUTO PUSH TO GITHUB API
            try {
                // 1. Ambil SHA file lama dari GitHub
                const getFile = await fetch(`https://api.github.com/repos/${repo}/contents/asalnulis_articles.json`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                
                let sha = "";
                if (getFile.ok) {
                    const fileData = await getFile.json();
                    sha = fileData.sha;
                }

                // 2. Upload/Commit file JSON baru
                const contentUnicode = new TextEncoder().encode(JSON.stringify(articles, null, 2));
                const base64Content = btoa(String.fromCharCode(...contentUnicode));

                const updateFile = await fetch(`https://api.github.com/repos/${repo}/contents/asalnulis_articles.json`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Update tulisan: ${articleObj.title}`,
                        content: base64Content,
                        sha: sha ? sha : undefined
                    })
                });

                if (updateFile.ok) {
                    localStorage.setItem('asalnulis_articles', JSON.stringify(articles));
                    resetForm();
                    renderAdminList();
                    alert('BERHASIL! Artikel telah dipublikasikan dan tersimpan otomatis di GitHub.');
                } else {
                    const errErr = await updateFile.json();
                    alert('Gagal push ke GitHub: ' + errErr.message);
                }
            } catch(err) {
                alert('Terjadi kesalahan jaringan saat Auto-Sync!');
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up text-sm"></i> Simpan & Langsung Auto-Publish ke GitHub`;
            }
        }

        function editArticle(index) {
            const art = articles[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('articleTitle').value = art.title;
            document.getElementById('articleDate').value = art.date || '';
            document.getElementById('articleCategory').value = art.category;
            document.getElementById('articleReadTime').value = art.readTime || '3 mnt';
            document.getElementById('imageData').value = art.image || '';
            document.getElementById('audioData').value = art.audio || '';
            document.getElementById('articleExcerpt').value = art.excerpt;
            document.getElementById('articleContent').value = art.content;

            document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-pen-to-square text-blue-600 mr-2"></i> Edit Tulisan';
            document.getElementById('cancelEditBtn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteArticle(index) {
            if (confirm('Yakin ingin menghapus tulisan ini?')) {
                articles.splice(index, 1);
                saveArticle(new Event('submit'));
            }
        }

        function resetForm() {
            document.getElementById('articleForm').reset();
            document.getElementById('editIndex').value = '-1';
            document.getElementById('articleDate').valueAsDate = new Date();
            document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-pen-nib mr-2"></i> Tulis Artikel Baru';
            document.getElementById('cancelEditBtn').classList.add('hidden');
        }

        checkAuth();
    </script>
</body>
</html>
