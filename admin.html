<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Asal Nulis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 font-sans p-4 sm:p-8 min-h-screen flex items-center justify-center">

    <!-- ================= LAYAR LOGIN ADMIN ================= -->
    <div id="login-screen" class="w-full max-w-md bg-white rounded-3xl p-6 sm:p-8 shadow-2xl border border-slate-200">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-black text-white rounded-2xl flex items-center justify-center text-2xl font-black mx-auto mb-3 shadow-md">
                AN
            </div>
            <h1 class="text-xl font-bold text-slate-900">Akses Pengelola Admin</h1>
            <p class="text-xs text-slate-500 mt-1">asalnulis.web.id</p>
        </div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Password Admin</label>
                <input type="password" id="admin-pass" required placeholder="Masukkan password admin" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-black focus:outline-none">
            </div>
            <div id="login-error" class="hidden text-xs text-rose-600 font-bold text-center">
                <i class="fa-solid fa-triangle-exclamation mr-1"></i> Password yang Anda masukkan salah!
            </div>
            <button type="submit" class="w-full py-3 bg-black hover:bg-slate-800 text-white font-bold rounded-xl text-sm shadow-md transition">
                Masuk ke Dashboard
            </button>
        </form>
    </div>

    <!-- ================= DASHBOARD ADMIN (TERSEMBUNYI) ================= -->
    <div id="admin-dashboard" class="hidden w-full max-w-2xl bg-white rounded-3xl p-6 sm:p-8 shadow-xl border border-slate-200">
        <!-- Header -->
        <div class="flex items-center justify-between border-b pb-4 mb-6">
            <div>
                <h1 class="text-xl font-bold text-slate-900">Admin Panel Editor</h1>
                <p class="text-xs text-slate-500">asalnulis.web.id</p>
            </div>
            <button onclick="logoutAdmin()" class="bg-rose-100 hover:bg-rose-200 text-rose-700 text-xs font-bold px-3 py-1.5 rounded-xl transition flex items-center gap-1.5">
                <i class="fa-solid fa-right-from-bracket"></i> Keluar
            </button>
        </div>

        <!-- Form Token GitHub -->
        <div class="mb-6 bg-slate-50 p-4 rounded-2xl border border-slate-200">
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">GitHub Personal Access Token</label>
            <div class="flex gap-2">
                <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs font-mono focus:outline-none focus:ring-2 focus:ring-black">
                <button onclick="saveToken()" class="px-4 py-2 bg-black text-white rounded-xl text-xs font-bold hover:bg-slate-800 transition">Simpan</button>
            </div>
            <p class="text-[10px] text-slate-400 mt-1">*Token tersimpan aman di browser Anda.</p>
        </div>

        <!-- Form Tambah Artikel -->
        <form id="article-form" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Judul Tulisan / Naskah</label>
                <input type="text" id="title" required placeholder="Masukkan judul tulisan..." class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-black">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Kategori Topik</label>
                    <select id="category" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm bg-white">
                        <option value="ASAL NULIS">ASAL NULIS</option>
                        <option value="RASAN-RASAN">RASAN-RASAN</option>
                        <option value="FIKSIANA">FIKSIANA</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Estimasi Waktu Baca</label>
                    <input type="text" id="readTime" value="3 mnt" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Path Gambar Sampul</label>
                    <input type="text" id="image-name" placeholder="images/tulisan-1.webp" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm font-mono">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Path Audio Backsound</label>
                    <input type="text" id="audio-name" placeholder="audio/backsound-1.mp3" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm font-mono">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Ringkasan / Sub-judul Sarkas (Excerpt)</label>
                <textarea id="excerpt" rows="2" required placeholder="Tuliskan 1-2 kalimat ringkasan singkat..." class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm"></textarea>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Isi Naskah Lengkap</label>
                <textarea id="content" rows="6" required placeholder="Tuliskan isi naskah tulisan secara lengkap..." class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm"></textarea>
            </div>

            <button type="submit" id="submit-btn" class="w-full py-3.5 bg-black hover:bg-slate-800 text-white font-bold rounded-xl text-sm shadow-lg transition">
                <i class="fa-solid fa-paper-plane mr-1"></i> Terbitkan Artikel Instan Ke GitHub
            </button>
        </form>

        <!-- Status Result -->
        <div id="status" class="hidden mt-4 p-4 rounded-xl text-xs text-center font-bold"></div>
    </div>

    <script>
        // PASSCODE ADMIN SAMA SEPERTI STSMAN1MUNCAR
        const ADMIN_PASSCODE = "admin123";

        const loginScreen = document.getElementById('login-screen');
        const adminDashboard = document.getElementById('admin-dashboard');
        const loginError = document.getElementById('login-error');

        if (sessionStorage.getItem('an_admin_logged') === 'true') {
            showDashboard();
        }

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const pass = document.getElementById('admin-pass').value;
            if (pass === ADMIN_PASSCODE) {
                sessionStorage.setItem('an_admin_logged', 'true');
                showDashboard();
            } else {
                loginError.classList.remove('hidden');
            }
        });

        function showDashboard() {
            loginScreen.classList.add('hidden');
            adminDashboard.classList.remove('hidden');
            document.getElementById('gh-token').value = localStorage.getItem('an_gh_token') || '';
        }

        function logoutAdmin() {
            sessionStorage.removeItem('an_admin_logged');
            location.reload();
        }

        function saveToken() {
            const token = document.getElementById('gh-token').value.trim();
            localStorage.setItem('an_gh_token', token);
            alert('Token berhasil disimpan!');
        }

        // METODE SIMPAN INSTAN DENGAN FILE BARU DI FOLDER content/ (ADOP STSMAN1MUNCAR)
        document.getElementById('article-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = localStorage.getItem('an_gh_token');
            const statusDiv = document.getElementById('status');
            const submitBtn = document.getElementById('submit-btn');

            if (!token) {
                alert('Silakan masukkan dan simpan GitHub Token Anda terlebih dahulu!');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = 'Mengirim ke GitHub...';
            statusDiv.classList.add('hidden');

            const title = document.getElementById('title').value;
            const category = document.getElementById('category').value;
            const readTime = document.getElementById('readTime').value;
            const image = document.getElementById('image-name').value;
            const audio = document.getElementById('audio-name').value;
            const excerpt = document.getElementById('excerpt').value;
            const content = document.getElementById('content').value;

            // MEMBUAT FILE UNIQUE TIMESTAMP TERPISAH
            const fileName = `article-${Date.now()}.json`;
            const fileData = {
                title, category, readTime, image, audio,
                excerpt, content,
                date: new Date().toISOString()
            };

            const repo = 'usudo218/blog'; // SESUAIKAN DENGAN REPO
            const path = `content/${fileName}`;
            const url = `https://api.github.com/repos/${repo}/contents/${path}`;

            try {
                const response = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Tambah artikel: ${title}`,
                        content: btoa(unescape(encodeURIComponent(JSON.stringify(fileData, null, 2)))),
                        branch: 'main'
                    })
                });

                if (response.ok) {
                    statusDiv.className = 'mt-4 p-4 rounded-xl text-xs text-center font-bold bg-emerald-100 text-emerald-800 block';
                    statusDiv.innerText = 'BERHASIL! Artikel baru telah diterbitkan ke GitHub.';
                    document.getElementById('article-form').reset();
                } else {
                    const err = await response.json();
                    throw new Error(err.message || 'Gagal menyimpan');
                }
            } catch (err) {
                statusDiv.className = 'mt-4 p-4 rounded-xl text-xs text-center font-bold bg-rose-100 text-rose-800 block';
                statusDiv.innerText = 'GAGAL: ' + err.message + ' (Pastikan token benar dan memiliki akses repo)';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Terbitkan Artikel Instan Ke GitHub';
            }
        });
    </script>
</body>
</html>
